services:
  ktane-solver-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ktane-solver
      POSTGRES_USER: ktane-solver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ktane-solver}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktane-solver -d ktane-solver"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ktane-solver-db:5432/ktane-solver
      SPRING_DATASOURCE_USERNAME: ktane-solver
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ktane-solver}
    ports:
      - "8080:8080"
    depends_on:
      ktane-solver-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/modules"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./ktanesolver-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
